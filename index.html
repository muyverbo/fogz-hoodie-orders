<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOGZ | Hoodie Order</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#15362f;background:#f5f1e8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:20px}.hero{background:#073a31;color:#fff;padding:22px;border-radius:16px 16px 0 0;text-align:center}.hero h1{margin:0;font-size:28px;letter-spacing:2px}.hero p{margin:8px 0 0;color:#e9d5a6}.photo{width:100%;display:block}.panel{background:white;padding:25px;border-radius:0 0 16px 16px;box-shadow:0 12px 30px #14382a15}label{display:block;font-weight:650;margin:18px 0 7px}input,select,textarea{width:100%;font:inherit;padding:13px;border:1px solid #b9c8c1;border-radius:9px;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid #b29a56}button{background:#073a31;color:#fff;font:inherit;font-weight:700;width:100%;border:0;border-radius:10px;padding:16px;margin-top:24px;cursor:pointer}.hint{font-size:13px;color:#586b62}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid label{margin-top:18px}.hidden{position:absolute;left:-9999px}footer{text-align:center;font-size:12px;color:#62746d;padding:20px}@media(max-width:460px){.grid{grid-template-columns:1fr;gap:0}.panel{padding:18px}}</style></head><body><main class="wrap"><header class="hero"><h1>FOGZ</h1><p>Official Team Hoodie Order</p></header><img class="photo" src="hoodie.jpg" alt="FOGZ custom hoodie front, back and design details"><section class="panel"><h2>Customize your hoodie</h2><p class="hint">Enter the name and number exactly as you want them printed. Each submission is for one hoodie style, size and personalization.</p><form name="fogz-hoodie-orders" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thank-you"><input type="hidden" name="form-name" value="fogz-hoodie-orders"><p class="hidden"><label>Leave this blank<input name="bot-field"></label></p><label for="buyer">Your name *</label><input id="buyer" name="order_contact_name" required maxlength="100" autocomplete="name"><label for="hoodie-name">Name on hoodie *</label><input id="hoodie-name" name="hoodie_name_exact" required maxlength="30" placeholder="e.g. GARCIA" spellcheck="false" autocapitalize="off"><p class="hint">Exact spelling and capitalization will be used.</p><div class="grid"><div><label for="number">Hoodie number *</label><input id="number" name="hoodie_number_exact" required maxlength="4" inputmode="numeric" pattern="[0-9]{1,4}" placeholder="e.g. 02"><p class="hint">Leading zeros are preserved.</p></div><div><label for="size">Hoodie size *</label><select id="size" name="hoodie_size" required><option value="">Select size</option><optgroup label="Youth"><option>YS</option><option>YM</option><option>YL</option><option>YXL</option></optgroup><optgroup label="Adult"><option>S</option><option>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option><option>4XL</option></optgroup></select></div></div><label for="qty">Quantity *</label><select id="qty" name="quantity" required><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label for="notes">Special instructions (optional)</label><textarea id="notes" name="notes" rows="3" maxlength="500" placeholder="Anything we should know?"></textarea><button type="submit">Submit Hoodie Order</button></form></section><footer>FOGZ Team Apparel</footer></main></body></html>
